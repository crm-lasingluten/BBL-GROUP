<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo BBL Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#20242C;
  --paper:#FBF9F5;
  --line:rgba(32,36,44,0.12);
  --bbl-ecru:#EAE1CC;
  --bbl-ink:#20242C;
  --bbl-gold:#9C7A3E;
  --bh-tan:#F3D9A4;
  --bh-tan-soft:#FBF0DA;
  --bh-brown:#4A2E18;
  --bh-orange:#E07C33;
  --bh-navy:#2B3341;
  --header-blue:#4F6279;
  --lsg-sky:#BFE3EE;
  --lsg-sky-soft:#EAF6FA;
  --lsg-ink:#14171A;
  --bo-black:#101012;
  --bo-charcoal:#1B1B1D;
  --bo-coral:#EE6F5E;
  --bo-white:#F5F5F3;
  --radius:4px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.1;}
p{margin:0;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ---------- HEADER ---------- */
header.site-head{
  position:sticky;top:0;z-index:50;
  background:var(--header-blue);
}
.head-row{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:center;gap:16px;
  padding:12px 20px;
}
.brand-mark{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer;background:none;border:none;padding:0;}
.brand-mark img{height:52px;width:auto;display:block;}

.lang-switch{display:flex;gap:2px;margin-left:auto;background:rgba(255,255,255,0.12);border-radius:20px;padding:3px;flex-shrink:0;}
.lang-switch button{
  border:none;background:transparent;padding:5px 10px;border-radius:16px;
  font-size:12px;font-weight:600;color:#c7c9ce;letter-spacing:0.03em;
}
.lang-switch button.active{background:#fff;color:var(--ink);}

.nav-row{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:center;gap:6px;
  padding:0 20px 12px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav-row::-webkit-scrollbar{display:none;}
.tab-btn{
  border:1px solid transparent;background:rgba(255,255,255,0.94);
  padding:9px 16px;border-radius:20px;
  font-size:13.5px;font-weight:600;white-space:nowrap;
  color:var(--ink);flex-shrink:0;
  transition:background .15s,color .15s,border-color .15s;
}
.tab-btn[data-brand="bagelhood"].active{background:var(--bh-orange);border-color:var(--bh-orange);color:#fff;}
.tab-btn[data-brand="lasingluten"].active{background:var(--lsg-ink);border-color:var(--lsg-ink);color:#fff;}
.tab-btn[data-brand="bocado"].active{background:var(--bo-coral);border-color:var(--bo-coral);color:#fff;}
.tab-btn[data-brand="bbl"].active{background:#fff;border-color:#fff;color:var(--ink);}

.search-wrap{
  max-width:1280px;margin:0 auto;padding:0 20px 14px;
  position:relative;
}
.search-wrap input{
  width:100%;padding:10px 16px 10px 40px;
  border:1px solid transparent;border-radius:22px;
  font-size:14px;font-family:inherit;background:#fff;
  outline:none;
}
.search-wrap input:focus{border-color:var(--bh-orange);}
.search-wrap svg{position:absolute;left:34px;top:9px;width:18px;height:18px;opacity:0.45;pointer-events:none;}

/* ---------- MAIN ---------- */
main{max-width:1280px;margin:0 auto;padding:0 20px 60px;min-height:60vh;}

/* Hero banners */
.hero{
  border-radius:10px;overflow:hidden;margin:22px 0 34px;
  display:grid;grid-template-columns:1.15fr 1fr;gap:0;
  min-height:260px;
}
@media (max-width:760px){.hero{grid-template-columns:1fr;}}
.hero .htext{padding:38px 34px;display:flex;flex-direction:column;justify-content:center;gap:14px;}
.hero .himg{background-size:cover;background-position:center;min-height:220px;}
.hero .eyebrow{font-size:12px;letter-spacing:0.08em;font-weight:600;opacity:0.7;}
.hero h1{font-size:clamp(28px,4vw,42px);}
.hero p.tag{font-size:16px;max-width:46ch;opacity:0.85;}

.hero.bbl{background:var(--bbl-ecru);color:var(--bbl-ink);}
.hero.bagelhood{background:var(--bh-tan);color:var(--bh-brown);}
.hero.lasingluten{background:var(--lsg-sky);color:var(--lsg-ink);}
.hero.bocado{background:var(--bo-black);color:var(--bo-white);}

/* BBL who-we-are */
.who-body{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;margin-bottom:44px;}
@media (max-width:760px){.who-body{grid-template-columns:1fr;}}
.who-body p{margin-bottom:14px;font-size:15.5px;color:#3a3d44;}
.who-side{background:var(--bbl-ecru);border-radius:10px;padding:24px;font-size:14px;color:var(--bbl-ink);}
.who-side h3{font-size:14px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;}

.section-title{
  font-size:22px;margin:46px 0 18px;
  display:flex;align-items:baseline;gap:10px;
}
.section-title .count{font-family:var(--font-body);font-size:13px;font-weight:500;color:#8a8d93;}

.brand-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:10px;}
@media (max-width:860px){.brand-cards{grid-template-columns:1fr;}}
.brand-card{
  border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px;
  border:1px solid var(--line);
  transition:transform .15s;
}
.brand-card:hover{transform:translateY(-2px);}
.brand-card img.blogo{height:58px;width:auto;align-self:flex-start;}
.brand-card.bocado img.blogo{height:96px;}
.brand-card p{font-size:14px;opacity:0.9;flex-grow:1;}
.brand-card button{
  align-self:flex-start;border:none;padding:9px 18px;border-radius:20px;
  font-size:13px;font-weight:600;
}
.brand-card.bagelhood{background:var(--bh-tan-soft);color:var(--bh-brown);}
.brand-card.bagelhood button{background:var(--bh-orange);color:#fff;}
.brand-card.lasingluten{background:var(--lsg-sky-soft);color:var(--lsg-ink);}
.brand-card.lasingluten button{background:var(--lsg-ink);color:#fff;}
.brand-card.bocado{background:var(--bo-charcoal);color:var(--bo-white);}
.brand-card.bocado button{background:var(--bo-coral);color:#fff;}

.dist-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
@media (max-width:860px){.dist-grid{grid-template-columns:1fr;}}
.dist-card{border:1px solid var(--line);border-radius:10px;padding:20px;}
.dist-card h4{font-size:15px;margin-bottom:8px;}
.dist-card p{font-size:13.5px;color:#5a5d63;}

.closing-banner{
  background:var(--ink);color:#fff;border-radius:10px;
  padding:32px;margin:36px 0 10px;font-size:16px;line-height:1.6;
}

/* Product grids */
.family-block{margin-bottom:38px;}
.family-heading{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
}
.family-heading h3{font-size:19px;}
.family-heading .rule{flex-grow:1;height:1px;background:var(--line);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;}

.card{
  border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:#fff;display:flex;flex-direction:column;
}
.card .cimg-wrap{aspect-ratio:1/1;overflow:hidden;background:#f2ede2;position:relative;}
.card .cimg-wrap img{width:100%;height:100%;object-fit:contain;padding:14px;}
.card .cbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex-grow:1;}
.card .sub-logo-badge{
  position:absolute;left:10px;bottom:10px;
  background:#fff;border-radius:6px;padding:4px 8px;
  box-shadow:0 1px 4px rgba(0,0,0,0.15);
  display:flex;align-items:center;
}
.card .sub-logo-badge img{height:22px;width:auto;object-fit:contain;padding:0;}
.card .cname{font-size:16.5px;font-weight:700;font-family:var(--font-display);}
.card .cdesc{font-size:13px;color:#565a61;}
.card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.chip{
  font-size:11px;font-weight:600;padding:4px 9px;border-radius:12px;
  background:#F1EEE6;color:#54575d;
}
.card .cweight{font-size:12px;color:#8a8d93;margin-top:auto;padding-top:8px;}

.cert-icons{display:flex;gap:10px;align-items:center;margin-top:4px;padding-top:6px;}
.cert-icons .cert-icon{height:26px;width:auto;object-fit:contain;}

.icon-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.icon-badge{
  display:flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:600;padding:4px 8px 4px 5px;border-radius:12px;
  background:#F1EEE6;color:#54575d;line-height:1.2;
}
.icon-badge .badge-icon-img{height:16px;width:16px;object-fit:contain;flex-shrink:0;}
.cert-row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.cert-row .cert-seal{height:34px;width:auto;object-fit:contain;}

details.fmt{margin-top:6px;font-size:12.5px;}
details.fmt summary{cursor:pointer;color:#7a7d84;font-weight:600;list-style:none;}
details.fmt summary::-webkit-details-marker{display:none;}
details.fmt summary::before{content:"+ ";}
details.fmt[open] summary::before{content:"– ";}
table.fmt-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px;}
table.fmt-table th,table.fmt-table td{border-bottom:1px solid var(--line);padding:4px 4px;text-align:left;}
table.fmt-table th{color:#8a8d93;font-weight:600;}

/* Bocado card variant */
.card.bocado-card{background:var(--bo-charcoal);color:var(--bo-white);border-color:#2c2c2f;}
.card.bocado-card .cdesc{color:#c8c8c6;}
.card.bocado-card .tagline-banner{
  background:var(--bo-coral);color:#fff;font-weight:700;font-size:12.5px;
  padding:7px 10px;border-radius:4px;text-transform:uppercase;letter-spacing:0.02em;
}
.macros-row{display:flex;gap:14px;margin:6px 0 2px;}
.macro{display:flex;flex-direction:column;}
.macro .v{font-size:20px;font-weight:700;font-family:var(--font-display);color:var(--bo-coral);}
.macro .l{font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;color:#b7b7b5;}
.serving-label{font-size:11px;color:#9c9c99;}
.card.bocado-card .chip{background:#2c2c2f;color:#d8d8d6;}
.card.bocado-card .icon-badge{background:#2c2c2f;color:#d8d8d6;}

/* Brand pill on search results */
.result-brandpill{
  display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.04em;padding:3px 9px;border-radius:10px;margin-bottom:8px;
}
.result-brandpill.bagelhood{background:var(--bh-orange);color:#fff;}
.result-brandpill.lasingluten{background:var(--lsg-ink);color:#fff;}
.result-brandpill.bocado{background:var(--bo-coral);color:#fff;}

.no-results{padding:60px 20px;text-align:center;color:#8a8d93;font-size:15px;}

/* ---------- FOOTER ---------- */
footer{background:var(--header-blue);color:#e7e5df;margin-top:40px;}
.footer-inner{max-width:1280px;margin:0 auto;padding:44px 20px 20px;}
.footer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-bottom:30px;}
@media (max-width:860px){.footer-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.footer-grid{grid-template-columns:1fr;}}
.fbrand img{height:42px;width:auto;margin-bottom:12px;display:block;}
.fbrand.bocado img{height:58px;}
.fbrand .fname{font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:8px;}
.fbrand .frow{font-size:12.5px;color:#c7c5bd;margin-bottom:4px;}
.fbrand .frow a{text-decoration:none;color:#c7c5bd;}
.fbrand .frow a:hover{color:#fff;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.12);padding-top:16px;font-size:12px;color:#9a988f;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

@media (max-width:600px){
  .head-row{flex-wrap:wrap;}
  .brand-mark .word{font-size:13px;}
}
</style>
</head>

<main id="main"></main>

    </div>
  </div>
</footer>

 sabor y el formato moderno, adaptado a los hábitos de consumo globales.", "fr": "Notre pari sur le dynamisme, la saveur et un format moderne, adapté aux habitudes de consommation mondiales.", "it": "La nostra scommessa sul dinamismo, il sapore e un formato moderno, adattato alle abitudini di consumo globali.", "en": "Our commitment to dynamism, flavor and a modern format, adapted to global consumption habits.", "pt": "A nossa aposta no dinamismo, no sabor e num formato moderno, adaptado aos hábitos de consumo globais."}, "intro_title": {"es": "Panadería Artesanal para tu Negocio", "fr": "Boulangerie Artisanale pour votre Entreprise", "it": "Panetteria Artigianale per la tua Attività", "en": "Artisan Bakery for your Business", "pt": "Panificação Artesanal para o teu Negócio"}, "intro_body": {"es": "Combinamos métodos tradicionales con volumen industrial, garantizando pan artesanal de calidad excepcional y suministro constante. Seleccionamos las mejores materias primas, como harina de molino de piedra de bajo refinado, para asegurar un sabor y consistencia inigualables.", "fr": "Nous combinons des méthodes traditionnelles avec un volume industriel, garantissant un pain artisanal d'une qualité exceptionnelle et un approvisionnement constant. Nous sélectionnons les meilleures matières premières, comme la farine de meule de pierre à faible raffinage, pour assurer une saveur et une texture inégalables.", "it": "Combiniamo metodi tradizionali con volumi industriali, garantendo pane artigianale di qualità eccezionale e fornitura costante. Selezioniamo le migliori materie prime, come la farina macinata a pietra a basso grado di raffinazione, per assicurare un sapore e una consistenza ineguagliabili.", "en": "We combine traditional methods with industrial volume, guaranteeing artisan bread of exceptional quality and constant supply. We select the finest raw materials, such as low-refined stone-ground flour, to ensure unmatched flavor and consistency.", "pt": "Combinamos métodos tradicionais com volume industrial, garantindo pão artesanal de qualidade excecional e fornecimento constante. Selecionamos as melhores matérias-primas, como farinha de moinho de pedra de baixo refinamento, para garantir um sabor e consistência inigualáveis."}, "email": "info@thebagelhood.com", "web": "www.thebagelhood.com", "phone": "+34 936 397 418", "families_order": ["bagels", "brioche", "vegana"]}, "lasingluten": {"name": "La Sin Gluten", "logo": "logo_lasingluten", "hero_img": "hero_lasingluten_collage", "tagline": {"es": "Compromiso total con la seguridad alimentaria, el sabor inigualable y la inclusión de todas las necesidades dietéticas sin renunciar a la máxima calidad.", "fr": "Un engagement total envers la sécurité alimentaire, une saveur inégalée et l'inclusion de tous les besoins diététiques, sans jamais renoncer à la qualité maximale.", "it": "Impegno totale per la sicurezza alimentare, un gusto ineguagliabile e l'inclusione di tutte le esigenze dietetiche, senza rinunciare alla massima qualità.", "en": "Total commitment to food safety, unbeatable flavor and inclusion of every dietary need, without ever compromising on quality.", "pt": "Compromisso total com a segurança alimentar, um sabor inigualável e a inclusão de todas as necessidades dietéticas sem abdicar da máxima qualidade."}, "intro_title": {"es": "Delicias listas para tu mesa", "fr": "Des délices prêts pour votre table", "it": "Delizie pronte per la tua tavola", "en": "Delicious treats ready for your table", "pt": "Delícias prontas para a tua mesa"}, "intro_body": {"es": "En nuestra cocina, sustituimos el gluten por pasión, técnica y los mejores ingredientes naturales para ofrecerte texturas increíbles y sabores auténticos. Cada producto pasa por un riguroso control de calidad para garantizarte una experiencia 100% segura y deliciosamente artesanal.", "fr": "Dans notre cuisine, nous remplaçons le gluten par de la passion, de la technique et les meilleurs ingrédients naturels pour vous offrir des textures incroyables et des saveurs authentiques. Chaque produit passe par un contrôle de qualité rigoureux pour vous garantir une expérience 100% sûre et délicieusement artisanale.", "it": "Nella nostra cucina, sostituiamo il glutine con passione, tecnica e i migliori ingredienti naturali per offrirti texture incredibili e sapori autentici. Ogni prodotto passa attraverso un rigoroso controllo di qualità per garantirti un'esperienza 100% sicura e deliziosamente artigianale.", "en": "In our kitchen, we replace gluten with passion, technique and the finest natural ingredients to offer you incredible textures and authentic flavors. Every product goes through rigorous quality control to guarantee a 100% safe and deliciously artisan experience.", "pt": "Na nossa cozinha, substituímos o glúten por paixão, técnica e os melhores ingredientes naturais para te oferecer texturas incríveis e sabores autênticos. Cada produto passa por um rigoroso controlo de qualidade para garantir uma experiência 100% segura e deliciosamente artesanal."}, "email": "info@lasingluten.es", "web": "www.lasingluten.es", "phone": "+34 931 592 650", "families_order": ["singluten", "pizzas"]}, "bocado": {"name": "Bocado Functional Foods", "logo": "logo_bocado", "hero_img": "hero_bocado_dark", "tagline": {"es": "Vanguardia en nutrición y funcionalidad, ofreciendo soluciones alimentarias inteligentes para un estilo de vida consciente.", "fr": "À l'avant-garde de la nutrition et de la fonctionnalité, offrant des solutions alimentaires intelligentes pour un mode de vie conscient.", "it": "All'avanguardia nella nutrizione e funzionalità, con soluzioni alimentari intelligenti per uno stile di vita consapevole.", "en": "At the forefront of nutrition and functionality, offering smart food solutions for a mindful lifestyle.", "pt": "Vanguarda em nutrição e funcionalidade, oferecendo soluções alimentares inteligentes para um estilo de vida consciente."}, "intro_title": {"es": "Somos una compañía de alim <script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const IMAGES = JSON.parse(document.getElementById('app-images').textContent);
let LANG = 'es';
let ACTIVE_BRAND = 'bbl';
let QUERY = '';

function img(key){ return DATA.external_images[key] || IMAGES[key] || ''; }
function t(key){ return (DATA.i18n[LANG] && DATA.i18n[LANG][key]) || DATA.i18n['es'][key] || key; }
function phrase(es){
  if(LANG==='es') return es;
  const p = DATA.phrases[es];
  return (p && p[LANG]) || es;
}
function badgeText(type, value){
  const tmpl = DATA.badges[type];
  if(!tmpl) return type;
  let s = tmpl[LANG] || tmpl['es'];
  if(value!==null && value!==undefined) s = s.replace('{v}', value);
  return s;
}
function familyName(key){
  const f = DATA.families[key];
  if(!f) return key;
  return f[LANG] || f['es'];
}

// ---------- render helpers ----------
function renderFormatTable(formats){
  if(!formats || !formats.length) return '';
  let rows = formats.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('');
  return `<details class="fmt"><summary>${t('format_title')}</summary>
    <table class="fmt-table"><thead><tr>
      <th>${t('th_ref')}</th><th>${t('th_weight')}</th><th>${t('th_size')}</th><th>${t('th_units')}</th><th>${t('th_box')}</th>
    </tr></thead><tbody>${rows}</tbody></table></details>`;
}

function renderChips(features){
  if(!features || !features.length) return '';
  return `<div class="chips">${features.map(f=>`<span class="chip">${phrase(f)}</span>`).join('')}</div>`;
}

function renderCertIcons(p){
  let icons = [];
  if(p.brand === 'bagelhood'){
    if(p.family === 'bagels' || p.family === 'vegana') icons.push(['icon_vegan', 'Vegano']);
    icons.push(['icon_leaf', 'Natural']);
    icons.push(['icon_noadditives', 'Sin aditivos químicos']);
  } else if(p.brand === 'lasingluten'){
    if(p.id !== 'mezclas_sin_gluten') icons.push(['icon_freezable', 'Congelable']);
    icons.push(['icon_glutenfree', 'Sin gluten']);
  }
  if(!icons.length) return '';
  return `<div class="cert-icons">${icons.map(([k,label])=>`<img src="${img(k)}" class="cert-icon" alt="${label}" title="${label}">`).join('')}</div>`;
}

function renderCertRow(p){
  let items = [];
  if(p.nutriscore) items.push(img('nutriscore_'+p.nutriscore+'_white'));
  if(p.ig24) items.push(img('ig24_seal_white'));
  if(p.topsante) items.push(img('topsante'));
  if(!items.length) return '';
  return `<div class="cert-row">${items.map(src=>`<img src="${src}" class="cert-seal" alt="">`).join('')}</div>`;
}

function renderBadgeIcon(type, value){
  const iconKey = DATA.badge_icons[type];
  const label = badgeText(type, value);
  const iconImg = iconKey ? `<img src="${img(iconKey)}" class="badge-icon-img" alt="">` : '';
  return `<div class="icon-badge">${iconImg}<span>${label}</span></div>`;
}

function renderStandardCard(p){
  const name = p.name[LANG] || p.name.es;
  const desc = p.desc[LANG] || p.desc.es;
  const imageSrc = img(p.image);
  let extra = '';
  if(p.formats){ extra = renderFormatTable(p.formats); }
  let weightLine = '';
  if(p.weight){ weightLine = `<div class="cweight">${t('net_weight')}: ${p.weight}</div>`; }
  const subbrandLogo = p.subbrand ? `<div class="sub-logo-badge"><img src="${img('logo_'+p.subbrand)}" alt="${p.subbrand}"></div>` : '';
  return `<div class="card" data-id="${p.id}">
    <div class="cimg-wrap"><img src="${imageSrc}" alt="${name}" loading="lazy">${subbrandLogo}</div>
    <div class="cbody">
      <div class="cname">${name}</div>
      <div class="cdesc">${desc}</div>
      ${renderChips(p.features)}
      ${weightLine}
      ${renderCertIcons(p)}
      ${extra}
    </div>
  </div>`;
}

function renderBocadoCard(p){
  const name = p.name[LANG] || p.name.es;
  const desc = p.desc[LANG] || p.desc.es;
  const tagline = p.tagline ? (p.tagline[LANG] || p.tagline.es) : '';
  const imageSrc = img(p.image);
  const serving = p.serving ? (p.serving[LANG] || p.serving.es) : '';
  const macros = p.macros || [];
  return `<div class="card bocado-card" data-id="${p.id}">
    <div class="cimg-wrap"><img src="${imageSrc}" alt="${name}" loading="lazy"></div>
    <div class="cbody">
      <div class="cname">${name}</div>
      ${tagline?`<div class="tagline-banner">${tagline}</div>`:''}
      <div class="cdesc">${desc}</div>
      ${macros.length? `<div class="macros-row">
        <div class="macro"><span class="v">${macros[0]}</span><span class="l">${t('carbs')}</span></div>
        <div class="macro"><span class="v">${macros[1]}</span><span class="l">${t('protein')}</span></div>
        <div class="macro"><span class="v">${macros[2]}</span><span class="l">${t('fiber')}</span></div>
      </div>`:''}
      ${serving?`<div class="serving-label">${serving} ${t('yields')}:</div>`:''}
      <div class="icon-badges">${(p.badges||[]).map(b=>renderBadgeIcon(b[0],b[1])).join('')}</div>
      ${renderCertRow(p)}
    </div>
  </div>`;
}

function renderCard(p){
  return p.brand==='bocado' ? renderBocadoCard(p) : renderStandardCard(p);
}

// ---------- BBL "who we are" view ----------

  const b = DATA.brands.bagelhood, l = DATA.brands.lasingluten, o = DATA.brands.bocado;
  return `
  <div class="hero bbl">
    <div class="htext">
      <span class="eyebrow">BBL GROUP · GLOBAL BAKERY</span>
      <h1>${t('who_title')}</h1>
      <p class="tag">${t('who_p1')}</p>
    </div>
    <div class="himg" style="background-image:url('${img('logo_bbl')}');background-size:180px;background-repeat:no-repeat;background-position:center;background-color:var(--bbl-ecru);"></div>
  </div>

  <div class="who-body">
    <div>
      <p>${t('who_p2')}</p>
      <p>${t('who_p3')}</p>
    </div>
    <div class="who-side">
      <h3>${t('distribution_title')}</h3>
      <p style="margin-bottom:10px;"><strong>${t('horeca_t')}</strong><br>${t('horeca_d')}</p>
      <p style="margin-bottom:10px;"><strong>${t('retail_t')}</strong><br>${t('retail_d')}</p>
      <p><strong>${t('b2c_t')}</strong><br>${t('b2c_d')}</p>
    </div>
  </div>

  <h2 class="section-title">${t('brands_title')}</h2>
  <div class="brand-cards">
    <div class="brand-card bagelhood">
      <img class="blogo" src="${img('logo_bagelhood')}" alt="The Bagel Hood">
      <p>${b.tagline[LANG]||b.tagline.es}</p>
      <button onclick="goBrand('bagelhood')">${t('explore')} →</button>
    </div>
    <div class="brand-card lasingluten">
      <img class="blogo" src="${img('logo_lasingluten')}" alt="La Sin Gluten">
      <p>${l.tagline[LANG]||l.tagline.es}</p>
      <button onclick="goBrand('lasingluten')">${t('explore')} →</button>
    </div>
    <div class="brand-card bocado">
      <img class="blogo" src="${img('logo_bocado_blanco')}" alt="Bocado Functional Foods">
      <p>${o.tagline[LANG]||o.tagline.es}</p>
      <button onclick="goBrand('bocado')">${t('explore')} →</button>
    </div>
  </div>

  <div class="closing-banner">${t('who_closing')}</div>
  `;
}

// ---------- Brand product view ----------
function renderBrand(brandKey){
  const b = DATA.brands[brandKey];
  const heroImgKey = b.hero_img;
  const products = DATA.products.filter(p=>p.brand===brandKey);
  let html = `
  <div class="hero ${brandKey}">
    <div class="htext">
      <span class="eyebrow">${b.name.toUpperCase()}</span>
      <h1>${b.intro_title[LANG]||b.intro_title.es}</h1>
      <p class="tag">${b.tagline[LANG]||b.tagline.es}</p>
    </div>
    <div class="himg" style="background-image:url('${img(heroImgKey)}');"></div>
  </div>
  <div class="who-body" style="margin-bottom:20px;">
    <p style="grid-column:1/-1;font-size:15.5px;color:#3a3d44;max-width:80ch;">${b.intro_body[LANG]||b.intro_body.es}</p>
  </div>
  `;
  (b.families_order||[]).forEach(famKey=>{
    const famProducts = products.filter(p=>p.family===famKey);
    if(!famProducts.length) return;
    html += `<div class="family-block">
      <div class="family-heading"><h3>${familyName(famKey)}</h3><div class="rule"></div><span style="font-size:12.5px;color:#8a8d93;">${famProducts.length} ${t('products_title').toLowerCase()}</span></div>
      <div class="grid">${famProducts.map(renderCard).join('')}</div>
    </div>`;
  });
  return html;
}

// ---------- Search results view ----------
function renderSearch(query){
  const q = query.trim().toLowerCase();
  const matches = DATA.products.filter(p=>{
    const name = (p.name[LANG]||p.name.es).toLowerCase();
    const desc = (p.desc[LANG]||p.desc.es).toLowerCase();
    const brandName = DATA.brands[p.brand].name.toLowerCase();
    return name.includes(q) || desc.includes(q) || brandName.includes(q);
  });
  if(!matches.length){
    return `<div class="no-results">${t('no_results')}</div>`;
  }
  let html = `<h2 class="section-title">${t('results_for')} "${query}" <span class="count">${matches.length}</span></h2><div class="grid">`;
  matches.forEach(p=>{
    const card = renderCard(p);
    html += card.replace('<div class="cbody">', `<div class="cbody"><span class="result-brandpill ${p.brand}">${DATA.brands[p.brand].name}</span>`);
  });
  html += `</div>`;
  return html;
}

// ---------- Footer ----------
function renderFooter(){
  const order = ['bagelhood','lasingluten','bocado'];
  const grid = document.getElementById('footerGrid');
  let bblCol = `<div class="fbrand">
    <img src="${img('logo_bbl_white')}" alt="BBL Group">
    <div class="fname">BBL Group</div>
    <div class="frow">Global Bakery Holding</div>
  </div>`;
  let cols = order.map(k=>{
    const b = DATA.brands[k];
    const logoKey = k==='bocado' ? 'logo_bocado_blanco' : (k==='bagelhood' ? 'logo_bagelhood_white' : b.logo);
    return `<div class="fbrand ${k}">
      <img src="${img(logoKey)}" alt="${b.name}">
      <div class="fname">${b.name}</div>
      <div class="frow"><a href="mailto:${b.email}">${b.email}</a></div>
      <div class="frow"><a href="https://${b.web}" target="_blank" rel="noopener">${b.web}</a></div>
      <div class="frow">${b.phone}</div>
    </div>`;
  }).join('');
  grid.innerHTML = bblCol + cols;
}

// ---------- Router / render ----------
function render(){
  const main = document.getElementById('main');
  if(QUERY.trim().length>0){
    main.innerHTML = renderSearch(QUERY);
  } else if(ACTIVE_BRAND==='bbl'){
    main.innerHTML = renderBBL();
  } else {
    main.innerHTML = renderBrand(ACTIVE_BRAND);
  }
  document.getElementById('imgLogoBBL').src = img('logo_bbl_white');
  document.title = 'BBL Group · ' + t('tagline_site');
  document.getElementById('searchInput').placeholder = t('search_ph');
  document.getElementById('footerRights').textContent = '© 2026 BBL Group. ' + t('rights');
  // update nav labels (brand names untranslated except "who")
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    if(btn.dataset.brand==='bbl') btn.textContent = t('who_title');
    btn.classList.toggle('active', btn.dataset.brand===ACTIVE_BRAND && QUERY.trim()==='');
  });
  renderFooter();
}

function goBrand(brandKey){
  ACTIVE_BRAND = brandKey;
  QUERY = '';
  document.getElementById('searchInput').value = '';
  window.scrollTo({top:0, behavior:'smooth'});
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>goBrand(btn.dataset.brand));
});

document.getElementById('logoHome').addEventListener('click', ()=>goBrand('bbl'));

let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e)=>{
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(()=>{ QUERY = val; render(); }, 150);
});

document.getElementById('langSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  LANG = btn.dataset.lang;
  document.documentElement.lang = LANG;
  document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

render();
</script>
</body>
</html>
